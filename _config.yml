# 站点基本信息
title: zhuofan's Lab
subtitle: AI / Data Science Student
description: 一个正在学习人工智能与数据科学的学生的小站
author: zhuofan
email: your@email.com

# URL 设置（部署后自动生效）
url: "https://zhuofan-lab.github.io"
baseurl: ""

# 社交链接（按需填写）
github_username: zhuofan-lab
blog_url: https://yourblog.com

# 主题与构建
theme: minima
markdown: kramdown
permalink: /posts/:title/

# 时区
timezone: Asia/Shanghai

# 排除文件，不参与构建
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# 默认前置参数
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
