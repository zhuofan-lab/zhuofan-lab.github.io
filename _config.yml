# 站点基本信息
title: zhuofan's Lab
subtitle: CV / Generative Models
description: 计算机本科生，关注视频生成、扩散模型与推荐算法
author: zhuofan

# URL 设置（部署后自动生效）
url: "https://zhuofan-lab.github.io"
baseurl: ""

# 主题与构建
theme: minima
markdown: kramdown
permalink: /posts/:title/

# 时区
timezone: Asia/Shanghai

# 排除文件，不参与构建
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# 默认前置参数
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"